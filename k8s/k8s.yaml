# ============================================================
# ORDER-SERVICE - Kubernetes Manifest
# Inclui: ConfigMap, PostgreSQL, Redis,
#         Deployment, Service, HPA
# ============================================================

---
# -------------------------------------------------------------------
# CONFIGMAP
# -------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
data:
  DATABASE_URL: jdbc:postgresql://postgres-order:5432/order_db
  DATABASE_USERNAME: order_user
  SERVER_PORT: "8080"
  REDIS_HOST: redis-order
  REDIS_PORT: "6379"
  EXCHANGE_SERVICE_URL: http://exchange-service:8080

---
# ===================================================================
# POSTGRESQL - PersistentVolumeClaim
# ===================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-order-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# -------------------------------------------------------------------
# POSTGRESQL - Deployment
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-order
  template:
    metadata:
      labels:
        app: postgres-order
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              value: order_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-order-pvc

---
# -------------------------------------------------------------------
# POSTGRESQL - Service
# -------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-order
spec:
  selector:
    app: postgres-order
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ===================================================================
# REDIS - Caching
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-order
  template:
    metadata:
      labels:
        app: redis-order
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-order
spec:
  selector:
    app: redis-order
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

---
# ===================================================================
# ORDER-SERVICE - Deployment
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: aaninhabc/order-service:v5
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /order/actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /order/actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15

---
# -------------------------------------------------------------------
# ORDER-SERVICE - Service
# -------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ===================================================================
# HPA - Auto Scaling
# Escala de 2 a 5 pods quando CPU > 70% ou memória > 80%
# ===================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80